<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro19 - Avatar Editor</title>
    <style>
        /* Authentic 2019 Roblox Dark Theme Color Scheme */
        :root {
            --rbx-bg: #191B1D;
            --rbx-nav: #232527;
            --rbx-card: #2B2D2F;
            --rbx-text: #FFFFFF;
            --rbx-text-muted: #B8B8B8;
            --rbx-green: #00B06F;
            --rbx-blue: #0074BD;
            --rbx-border: #393B3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "HCo Gotham SSm", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--rbx-bg);
            color: var(--rbx-text);
            overflow-y: scroll;
        }

        /* 2019 Era Navigation Bar Layout */
        nav {
            background-color: var(--rbx-nav);
            border-bottom: 1px solid var(--rbx-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 44px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: var(--rbx-text);
            text-decoration: none;
        }

        .nav-link {
            color: var(--rbx-text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            border-bottom: 2px solid var(--rbx-text);
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .currency-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 3px;
        }

        .robux-icon {
            width: 14px;
            height: 14px;
            background-color: var(--rbx-green);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-block;
        }

        /* Dedicated 2019 Avatar Editor Layout Layout */
        .container {
            margin-top: 64px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .avatar-editor-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
        }

        /* --- Column 1: Left Preview Pane --- */
        .preview-pane {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--rbx-border);
            padding-bottom: 10px;
        }

        .pane-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* R6 / R15 Style Selector Toggle */
        .type-selector {
            display: flex;
            background-color: rgba(0,0,0,0.3);
            padding: 2px;
            border-radius: 4px;
        }

        .type-btn {
            background: none;
            border: none;
            color: var(--rbx-text-muted);
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .type-btn.active {
            background-color: var(--rbx-border);
            color: var(--rbx-text);
        }

        /* Character Rig Box Viewport */
        .avatar-viewport {
            width: 100%;
            height: 320px;
            background: radial-gradient(circle, #3d4145 0%, #1a1c1e 100%);
            border: 1px solid #111;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* Character Block Structure Nodes */
        .rig-head {
            width: 44px;
            height: 44px;
            background-color: #E29C12;
            position: absolute;
            top: 55px;
            border-radius: 2px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.15);
        }

        .rig-face {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            user-select: none;
        }

        .rig-torso {
            width: 84px;
            height: 84px;
            background-color: #0074BD;
            position: absolute;
            top: 102px;
            border-radius: 2px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-arm, .rig-right-arm {
            width: 40px;
            height: 84px;
            background-color: #E29C12;
            position: absolute;
            top: 102px;
            border-radius: 2px;
            box-shadow: inset -3px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-arm { left: 49px; }
        .rig-right-arm { right: 49px; }

        .rig-left-leg, .rig-right-leg {
            width: 40px;
            height: 84px;
            background-color: #A34A1B;
            position: absolute;
            top: 189px;
            border-radius: 2px;
            box-shadow: inset -3px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-leg { left: 91px; }
        .rig-right-leg { right: 91px; }

        /* Dynamic Accessory Mounting Points */
        .rig-hat-mount {
            position: absolute;
            top: 12px;
            width: 80px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 54px;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0px 5px 4px rgba(0,0,0,0.6));
        }

        /* --- Column 2: Inventory Wardrobe Controls --- */
        .wardrobe-pane {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Category Filter Row Tabs */
        .wardrobe-tabs {
            display: flex;
            border-bottom: 2px solid var(--rbx-border);
            gap: 5px;
        }

        .wardrobe-tab-btn {
            background: none;
            border: none;
            color: var(--rbx-text-muted);
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s;
        }

        .wardrobe-tab-btn:hover {
            color: var(--rbx-text);
        }

        .wardrobe-tab-btn.active {
            color: var(--rbx-blue);
            border-bottom-color: var(--rbx-blue);
        }

        /* Skin Palette Layout */
        .skin-tone-container {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 4px;
            padding: 15px;
            display: none; /* Dynamic display toggling handled by JS */
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        .skin-box {
            aspect-ratio: 1;
            border: 1px solid rgba(0,0,0,0.4);
            border-radius: 3px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .skin-box:hover {
            transform: scale(1.15);
            border-color: white;
        }

        /* Grid Framework for Unlocked Wardrobe Inventory */
        .wardrobe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .wardrobe-card {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .wardrobe-card:hover {
            border-color: #555759;
        }

        .wardrobe-card.equipped {
            border-color: var(--rbx-blue);
            background-color: rgba(0, 114, 189, 0.05);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1;
            background-color: #1A1C1E;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Item Equipped Checkmarks Badge Layout */
        .equipped-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: var(--rbx-blue);
            color: white;
