<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro19 - 2019 Roblox Catalog & Avatar Editor</title>
    <style>
        /* Authentic 2019 Roblox Dark Theme Color Scheme */
        :root {
            --rbx-bg: #191B1D;
            --rbx-nav: #232527;
            --rbx-card: #2B2D2F;
            --rbx-text: #FFFFFF;
            --rbx-text-muted: #B8B8B8;
            --rbx-green: #00B06F;
            --rbx-blue: #0074BD;
            --rbx-border: #393B3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "HCo Gotham SSm", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--rbx-bg);
            color: var(--rbx-text);
            overflow-y: scroll;
        }

        /* 2019 Era Navigation Bar Layout */
        nav {
            background-color: var(--rbx-nav);
            border-bottom: 1px solid var(--rbx-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 44px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: var(--rbx-text);
            text-decoration: none;
        }

        .nav-link {
            color: var(--rbx-text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            border-bottom: 2px solid var(--rbx-text);
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .currency-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 3px;
        }

        /* Hexagonal Robux geometry from 2019 refresh */
        .robux-icon {
            width: 14px;
            height: 14px;
            background-color: var(--rbx-green);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-block;
        }

        /* Main Workspace Framework */
        .container {
            margin-top: 64px;
            padding: 20px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--rbx-text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* 3-Column Studio Grid Layout */
        .catalog-layout {
            display: grid;
            grid-template-columns: 200px 300px 1fr;
            gap: 24px;
        }

        /* Sidebar Navigation & Filters */
        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: var(--rbx-text-muted);
            letter-spacing: 0.5px;
        }

        .filter-list {
            list-style: none;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--rbx-border);
            padding-bottom: 15px;
        }

        .filter-item button {
            background: none;
            border: none;
            color: var(--rbx-text);
            font-size: 14px;
            padding: 8px 12px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .filter-item button:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .filter-item button.active {
            color: var(--rbx-blue);
            font-weight: 600;
            background-color: rgba(0, 116, 189, 0.1);
        }

        /* --- 2019 Avatar Preview Box Styles --- */
        .avatar-preview-pane {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .avatar-preview-pane h3 {
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--rbx-border);
            padding-bottom: 8px;
        }

        /* 2D Canvas Rig representing classic blocky avatars */
        .avatar-canvas {
            width: 100%;
            height: 280px;
            background: radial-gradient(circle, #3a3d40 0%, #1e2022 100%);
            border: 1px solid #111;
            border-radius: 3px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Character Component Blocks */
        .rig-head {
            width: 40px;
            height: 40px;
            background-color: #E29C12;
            position: absolute;
            top: 60px;
            border-radius: 2px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.15);
        }

        .rig-face {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            user-select: none;
        }

        .rig-torso {
            width: 80px;
            height: 80px;
            background-color: #0074BD;
            position: absolute;
            top: 103px;
            border-radius: 2px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-arm, .rig-right-arm {
            width: 38px;
            height: 80px;
            background-color: #E29C12;
            position: absolute;
            top: 103px;
            border-radius: 2px;
            box-shadow: inset -3px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-arm { left: 59px; }
        .rig-right-arm { right: 59px; }

        .rig-left-leg, .rig-right-leg {
            width: 38px;
            height: 80px;
            background-color: #A34A1B;
            position: absolute;
            top: 186px;
            border-radius: 2px;
            box-shadow: inset -3px -4px 0px rgba(0,0,0,0.15);
        }

        .rig-left-leg { left: 101px; }
        .rig-right-leg { right: 101px; }

        /* Dynamic Visual Mounts for Custom 2019 Hats */
        .rig-hat-slot {
            position: absolute;
            top: 25px;
            width: 70px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 46px;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5));
        }

        /* Equipped Accessories Registry Box */
        .equipped-items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .equipped-tag {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--rbx-border);
            padding: 6px 10px;
            border-radius: 3px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #FF4A4A;
            cursor: pointer;
            font-weight: bold;
        }

        /* Main Store Grid Architecture */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .item-card {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: #555759;
        }

        .item-image {
            width: 100%;
            aspect-ratio: 1;
            background-color: #1A1C1E;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 10px;
            user-select: none;
            position: relative;
        }

        /* Dual Tone Graphics for custom Valkyrie styling */
        .purple-blue-overlay {
            background: linear-gradient(135deg, #7F00FF 0%, #0074BD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sparkle-overlay {
            text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            color: var(--rbx-text);
        }

        .item-creator {
            font-size: 12px;
            color: var(--rbx-text-muted);
            margin-bottom: 12px;
        }
