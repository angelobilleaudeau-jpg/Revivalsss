<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro19 - 2019 Roblox Revival</title>
    <style>
        :root {
            --rbx-bg: #191B1D;
            --rbx-nav: #232527;
            --rbx-card: #2B2D2F;
            --rbx-text: #FFFFFF;
            --rbx-text-muted: #B8B8B8;
            --rbx-green: #00B06F;
            --rbx-blue: #0074BD;
            --rbx-border: #393B3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "HCo Gotham SSm", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--rbx-bg);
            color: var(--rbx-text);
        }

        /* Navigation Bar */
        nav {
            background-color: var(--rbx-nav);
            border-bottom: 1px solid var(--rbx-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 44px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: var(--rbx-text);
            text-decoration: none;
        }

        .nav-link {
            color: var(--rbx-text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            border-bottom: 2px solid var(--rbx-text);
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .currency-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Main Layout */
        .container {
            margin-top: 64px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--rbx-text-muted);
            margin-bottom: 20px;
        }

        /* Catalog Layout */
        .catalog-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
        }

        /* Sidebar Filters */
        .sidebar h3 {
            font-size: 16px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: var(--rbx-text-muted);
            letter-spacing: 0.5px;
        }

        .filter-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .filter-item button {
            background: none;
            border: none;
            color: var(--rbx-text);
            font-size: 14px;
            padding: 8px 0;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .filter-item button:hover, .filter-item button.active {
            color: var(--rbx-blue);
            font-weight: 600;
        }

        /* Item Grid */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .item-card {
            background-color: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 3px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: var(--rbx-text-muted);
        }

        .item-image {
            width: 100%;
            aspect-ratio: 1;
            background-color: #111;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .item-creator {
            font-size: 11px;
            color: var(--rbx-text-muted);
            margin-bottom: 8px;
        }

        .item-price {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 700;
            color: var(--rbx-green);
        }

        .robux-icon {
            width: 14px;
            height: 14px;
            background-color: var(--rbx-green);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-block;
        }

        .free-tag {
            color: var(--rbx-text-muted);
        }
    </style>
</head>
<body>

        <div class="nav-left">
            <a href="#" class="logo">ROBLOX</a>
            <a href="#" class="nav-link">Games</a>
            <a href="#" class="nav-link active">Catalog</a>
            <a href="#" class="nav-link">Develop</a>
            <a href="#" class="nav-link">Robux</a>
        </div>
        <div class="nav-right">
            <div class="currency-display">
                <span class="robux-icon"></span>
                <span id="robux-count">10,000</span>
            </div>
            <a href="#" class="nav-link">Profile</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Catalog</h1>
            <p>2019 Revival Edition — All Accessories Unlocked</p>
        </header>

        <div class="catalog-layout">
            <aside class="sidebar">
                <h3>Accessories</h3>
                <ul class="filter-list">
                    <li class="filter-item"><button class="active" onclick="filterCategory('all')">All Accessories</button></li>
                    <li class="filter-item"><button onclick="filterCategory('hat')">Hats</button></li>
                    <li class="filter-item"><button onclick="filterCategory('hair')">Hair</button></li>
                    <li class="filter-item"><button onclick="filterCategory('face')">Face</button></li>
                    <li class="filter-item"><button onclick="filterCategory('neck')">Neck</button></li>
                    <li class="filter-item"><button onclick="filterCategory('shoulder')">Shoulder</button></li>
                    <li class="filter-item"><button onclick="filterCategory('front')">Front</button></li>
                    <li class="filter-item"><button onclick="filterCategory('back')">Back</button></li>
                    <li class="filter-item"><button onclick="filterCategory('waist')">Waist</button></li>
                </ul>
            </aside>

            <main>
                <div class="item-grid" id="catalog-grid">
                    <!-- Items dynamically generated by JavaScript -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // High quality 2019-era item database mockup
        const catalogItems = [

            { id: 7, name: "Fedora", category: "hat", price: 150, icon: "🎩" },

            { id: 9, name: "Dominus Empyreus", category: "hat", price: 5000000, icon: "🦹" },
            { id: 10, name: "Shaggy", category: "hair", price: 2, icon: "💇‍♂️" },
            { id: 11, name: "Beast Mode", category: "face", price: 100, icon: "🐯" },
            { id: 12, name: "Gold Ninja Mask", category: "face", price: 500, icon: "🥷" }
        ];

        function renderCatalog(filter = 'all') {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' 
                ? catalogItems 
                : catalogItems.filter(item => item.category === filter);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                const priceDisplay = item.price === 0 
                    ? '<span class="free-tag">Free</span>' 
                    : `<span class="robux-icon"></span> ${item.price.toLocaleString()}`;

                card.innerHTML = `
                    <div class="item-image">${item.icon}</div>
                    <div class="item-name" title="${item.name}">${item.name}</div>
                    <div class="item-creator">By Roblox</div>
                    <div class="item-price">${priceDisplay}</div>
                `;
                grid.appendChild(card);
            });
        }
